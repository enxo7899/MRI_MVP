# ============================================================================
# MINISTRIA E SHËNDETËSISË DHE MBROJTJES SOCIALE
# Nginx Reverse Proxy Configuration
# Single Entry Point - Port 80
# ============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 500M;  # Large DICOM files

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/dicom+json;

    # ========================================================================
    # Upstream Definitions
    # ========================================================================
    upstream web_portal {
        server web-portal:3000;
        keepalive 32;
    }

    upstream ohif_viewer {
        server ohif:80;
        keepalive 32;
    }

    upstream orthanc_pacs {
        server orthanc:8042;
        keepalive 32;
    }

    upstream monai_label {
        server monailabel:8000;
        keepalive 32;
    }

    # ========================================================================
    # Main Server Block - Port 80
    # ========================================================================
    server {
        listen 80;
        server_name _;

        # ==================================================================
        # CRITICAL: Cross-Origin Headers for OHIF SharedArrayBuffer
        # These headers enable OHIF's multi-threaded image decoding
        # ==================================================================
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ==================================================================
        # ROOT: Web Portal (Next.js Albanian Dashboard)
        # ==================================================================
        location / {
            proxy_pass http://web_portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # ==================================================================
        # /viewer: OHIF Medical Image Viewer
        # ==================================================================
        location /viewer {
            rewrite ^/viewer$ /viewer/ permanent;
        }

        location /viewer/ {
            proxy_pass http://ohif_viewer/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # OHIF-specific headers
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter_types *;
        }

        # ==================================================================
        # /pacs: Orthanc PACS (REST API & DICOMweb)
        # ==================================================================
        location /pacs/ {
            proxy_pass http://orthanc_pacs/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS headers for DICOMweb
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }

            # Large DICOM transfers
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 75s;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # DICOMweb specific endpoint
        location /pacs/dicom-web/ {
            proxy_pass http://orthanc_pacs/dicom-web/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS for DICOMweb
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            proxy_read_timeout 600s;
            proxy_buffering off;
        }

        # ==================================================================
        # /monai: MONAI Label AI Engine
        # ==================================================================
        location /monai/ {
            proxy_pass http://monai_label/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS for AI API
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With";
                add_header Access-Control-Max-Age 3600;
                return 204;
            }

            # AI inference can take time
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
            proxy_connect_timeout 75s;
        }

        # ==================================================================
        # Health Check Endpoint
        # ==================================================================
        location /health {
            access_log off;
            return 200 '{"status": "healthy", "service": "MOH Albania Medical Imaging Platform"}';
            add_header Content-Type application/json;
        }

        # ==================================================================
        # Error Pages (Albanian)
        # ==================================================================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
