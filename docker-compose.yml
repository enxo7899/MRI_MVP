# ============================================================================
# MINISTRIA E SHËNDETËSISË DHE MBROJTJES SOCIALE
# Platforma Kombëtare AI e Imazherisë Mjekësore
# Docker Compose - Infrastruktura
# ============================================================================

networks:
  medical-net:
    driver: bridge
    name: medical-net

volumes:
  orthanc-storage:
    name: orthanc-dicom-storage
  monai-models:
    name: monai-model-cache

services:
  # ==========================================================================
  # NGINX - Reverse Proxy & Entry Point (Port 80)
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: moh-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-portal
      - orthanc
      - ohif
      - monailabel
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # ORTHANC - PACS Server (DICOM Storage & DICOMweb)
  # ==========================================================================
  orthanc:
    image: jodogne/orthanc-plugins:1.12.3
    container_name: moh-orthanc-pacs
    restart: unless-stopped
    ports:
      - "8042:8042"  # Expose for direct access during testing
      - "4242:4242"  # DICOM port
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
      - ./config/orthanc.json:/etc/orthanc/orthanc.json:ro
    networks:
      - medical-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8042/system || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # OHIF Viewer - Medical Image Viewer
  # ==========================================================================
  ohif:
    image: ohif/app:v3.8.0
    container_name: moh-ohif-viewer
    restart: unless-stopped
    volumes:
      - ./config/ohif-config.js:/usr/share/nginx/html/app-config.js:ro
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # MONAI Label - AI Inference Engine
  # ==========================================================================
  monailabel:
    build:
      context: ./monai-app
      dockerfile: Dockerfile
    container_name: moh-monai-ai
    restart: unless-stopped
    ports:
      - "8000:8000"  # Expose for direct access during testing
    environment:
      MONAI_LABEL_APP: "/app/apps/ministry_app"
      MONAI_LABEL_STUDIES: "http://orthanc:8042/dicom-web"
      MONAI_LABEL_HOST: "0.0.0.0"
      MONAI_LABEL_PORT: "8000"
    volumes:
      - monai-models:/app/model
      - ./monai-app/apps:/app/apps:ro
    depends_on:
      - orthanc
    networks:
      - medical-net
    # Uncomment below for GPU support (requires nvidia-docker)
    # runtime: nvidia
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/info/ || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 180s

  # ==========================================================================
  # WEB PORTAL - Next.js Albanian Dashboard
  # ==========================================================================
  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
    container_name: moh-web-portal
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_PACS_URL: "/pacs"
      NEXT_PUBLIC_VIEWER_URL: "/viewer"
      NEXT_PUBLIC_MONAI_URL: "/monai"
    networks:
      - medical-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
